# ============================================================================
# Docker 单容器部署 profile
# ----------------------------------------------------------------------------
# 与 dev profile 一起激活(spring.profiles.active=dev,docker),
# docker 后加载,覆盖 dev 里的 sandbox / remote SSH 设置.
#
# sandbox 保持 disabled (不触发 sandboxFilesystem / DockerFilesystemSpec 创建,
# 避免去连不存在的 agentscope-shared-demo 容器), 文件系统走容器本地.
# python_exec 通过 local-python-enabled=true 单独开门:
#   - PythonExecTool bean 用 @ConditionalOnExpression(sandbox.enabled OR local-python-enabled)
#     在 local-python-enabled=true 时仍会创建
#   - buildCommand() 检查 localPythonEnabled, 返回 List.of("python3","-") 本地 fork
#     跟 script_exec 同链路, 无 SSH/docker exec, ~50ms
# ============================================================================

# ---- Sandbox: 关掉 (文件系统走本地), python_exec 走容器本地 python3 ---------
harness.a2a.sandbox.enabled=false
harness.a2a.sandbox.remote-docker-enabled=false
harness.a2a.sandbox.local-python-enabled=true

# ---- 三个 remote 全关,文件落容器本地 ---------------------------------------
harness.a2a.artifacts.remote.enabled=false
harness.a2a.skills.remote.enabled=false
harness.a2a.memory.remote.enabled=false

# ---- workspace 路径用容器内可写目录 ---------------------------------------
# dev profile 默认 .agentscope/workspace/...,容器里以 / 为根,
# 改成绝对路径避免落到不可写位置
harness.a2a.workspace.path=/workspace/harness-a2a

# ---- GaussDB Flyway 迁移:关闭 ----------------------------------------------
# openGauss 5.0 报告为 PostgreSQL 9.2,Flyway Community Edition 9.22 拒绝迁移
# (FlywayEditionUpgradeRequiredException)。MySQL Flyway 不受影响,保留。
# 见 FlywayConfig.gaussFlyway @ConditionalOnProperty
harness.flyway.gauss.enabled=false
