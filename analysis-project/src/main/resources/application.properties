# ============================================================================
# P0-4: Spring Boot Actuator + Prometheus 监控端点
# ----------------------------------------------------------------------------
# /actuator/health - 健康检查 (k8s liveness/readiness 可用)
# /actuator/info - 构建信息
# /actuator/metrics - Micrometer 指标列表 (jvm.*/process.*/http.server.requests/*)
# /actuator/prometheus - Prometheus 抓取端点 (text/plain 0.0.4 格式)
#
# Prometheus 抓取配置示例:
#   scrape_configs:
#     - job_name: 'agentscope-a2a'
#       metrics_path: /actuator/prometheus
#       static_configs:
#         - targets: ['localhost:8081']
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.9,0.99

# ============================================================================
# P0-1: Flyway schema 迁移
# ----------------------------------------------------------------------------
# baseline-on-migrate=true: 已有 schema 的库上建立 baseline, 不重新创建已存在的表
# baseline-version=0: baseline 版本号, V20260718__baseline_*.sql 会作为第一次迁移
# validate-on-migrate=false: 已有库可能有手动改动, 不校验历史
# locations: 只扫 classpath:db/migration (默认还扫 db/migration/<vendor>, 我们不需要)
# ============================================================================
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history

# GaussDB 迁移由自定义 gaussFlyway bean (FlywayConfig) 在应用启动时自动执行。
# 仅当部署方有意在应用外部管理 schema 迁移时才设为 false。
harness.flyway.gauss.enabled=true

# ============================================================================
# P2-4: remote-docker / artifacts / skills / memory 同步共用的 SSH 选项。
# ----------------------------------------------------------------------------
# 仅当对应 profile 里设置了 `*.remote.enabled=true` 时才生效,否则不生效。
# 各 profile 可覆盖 ssh-target / remote-root / timeout-seconds,但会从下方继承
# SSH 选项数组,消除 application-dev / application-sandbox-windows 之间约 28 行重复配置。
# ============================================================================
harness.a2a.sandbox.remote-docker-ssh-options[0]=-o
harness.a2a.sandbox.remote-docker-ssh-options[1]=StrictHostKeyChecking=accept-new
harness.a2a.sandbox.remote-docker-ssh-options[2]=-o
harness.a2a.sandbox.remote-docker-ssh-options[3]=LogLevel=ERROR

harness.a2a.artifacts.remote.ssh-options[0]=-o
harness.a2a.artifacts.remote.ssh-options[1]=StrictHostKeyChecking=accept-new
harness.a2a.artifacts.remote.ssh-options[2]=-o
harness.a2a.artifacts.remote.ssh-options[3]=LogLevel=ERROR

harness.a2a.skills.remote.ssh-options[0]=-o
harness.a2a.skills.remote.ssh-options[1]=StrictHostKeyChecking=accept-new
harness.a2a.skills.remote.ssh-options[2]=-o
harness.a2a.skills.remote.ssh-options[3]=LogLevel=ERROR

harness.a2a.memory.remote.ssh-options[0]=-o
harness.a2a.memory.remote.ssh-options[1]=StrictHostKeyChecking=accept-new
harness.a2a.memory.remote.ssh-options[2]=-o
harness.a2a.memory.remote.ssh-options[3]=LogLevel=ERROR

# ============================================================================
# V3.0 验证 Agent (harness.a2a.verification.*) — 当前整体关闭
# ----------------------------------------------------------------------------
# Java 默认 enabled=true (HarnessRunnerProperties.Verification), 此行必须显式
# false, 不能删, 否则验证管线会被静默打开。
# checkpoints 不含 supervisor-exit: 直跑路径(SQL取数+pandas+arith复算)无需二次验证,
# verify agent 跑 ~54s 阻塞 done 事件导致前端卡顿 60s (2026/07/26 移除)。
# 其余 verification.* 键及 verify/critic 模型实例已删: 文件值与 Java 默认一致或仅
# 被已关闭的管线消费, 重新启用时参考 HarnessRunnerProperties.Verification 与 git 历史。
harness.a2a.verification.enabled=false
harness.a2a.verification.checkpoints=subagent-exit,per-critical-tool

# ---- Tool Result 智能压缩 (减少 LLM context 累积) ---------------------------------------------------
# load_skill_through_path 返回 SKILL.md 全文 (~5K 字符), 主 agent 第一次推理需要完整内容
# 规划下一步 (spawn 哪个子 agent / 传什么参数), 但后续轮次这个 tool result 已经"用过",
# 再原样留在 context 里纯属浪费 token.
#
# 策略: 每轮 LLM 调用前, 找 messages 中最后一个 ToolResultBlock (即将消费的新结果) 不动,
# 之前的 load_skill_through_path 结果走 compactMarkdown() 智能压缩 - 保留所有结构化 markdown
# 元素 (frontmatter / 代码块 / 表格 / section header / bullet & numbered list / filters: 行),
# 只丢弃描述性段落和 quote block (> xxx).
#
# 注意: SKILL.md 作者必须把硬规则写成 bullet list (- xxx), 不要写成 quote block (> xxx),
# 否则压缩时会丢. (见 docs/memory_truncated/tool-result-truncation-plan.md)
#
# wide_table_query / python_exec / arith 不在 tools 列表里, 完全不受影响.
# (wide_table_query 的大表 CSV 已被 ArtifactHandoffHook 处理成短 handoff 消息.)
#
# 添加更多工具: tools=load_skill_through_path,another_tool
harness.a2a.tool-truncation.enabled=true
harness.a2a.tool-truncation.tools=load_skill_through_path,sql_list

# ---- 文本格式工具调用兜底 -----------------------------------------------------------
# 某些通道不支持原生 function calling, 会把工具调用当纯文本输出
# (分隔符 + <function=NAME><parameter=KEY>value</parameter></function>),
# TextToolCallFallbackModel 拦截这种文本并解析回真实工具调用, 避免 ReAct
# 空转到 MAX_ITERATIONS 并把原始标记吐给用户。根因修复仍是换通道。
harness.a2a.tool-text-fallback.enabled=true

# ---- 模型输入上下文预算 ---------------------------------------------------------------
harness.a2a.context-budget.enabled=true
harness.a2a.context-budget.max-input-tokens=50000
harness.a2a.context-budget.model-context-tokens=64000
harness.a2a.context-budget.reserve-output-tokens=8000
harness.a2a.context-budget.warn-ratio=0.80
harness.a2a.context-budget.hard-ratio=1.00
harness.a2a.context-budget.artifact-tools=sql_registry_exec,script_exec,wide_table_query,python_exec
harness.a2a.context-budget.max-latest-tool-tokens=8000
harness.a2a.compaction.trigger-messages=20
harness.a2a.compaction.keep-messages=8

# ---- Skill 路由元数据 / 候选可见性 ---------------------------------------------
# 分阶段上线: 生产技能配置好有效元数据之前保持 false。
harness.a2a.skill-context.routing.enabled=true
harness.a2a.skill-context.max-visible-skills=5
harness.a2a.skill-context.fallback-visible-skills=10
harness.a2a.skill-context.min-confidence=0.65
harness.a2a.skill-context.min-score-gap=0.10
harness.a2a.skill-context.metadata-cache-ttl-ms=30000
harness.a2a.capability-routing.cache-ttl-ms=30000

# 数据库驱动的能力路由器。在 capability_registry 与 skill_capability_binding
# 表填充数据且离线路由评估通过之前保持禁用。
harness.a2a.capability-routing.enabled=false
harness.a2a.capability-routing.max-capabilities=3
harness.a2a.capability-routing.max-recalled-skills=20

# 统一的 SQL/API/SCRIPT 发现。切换发布: 旧的 tool_index 包装 Skill 已移除,
# 统一 tool_index 元工具、指标目录中间件以及 TOPIC -> METRIC -> DIMENSION 三级
# 路由已启用。回滚方式: 设置 enabled=false (SQL/SCRIPT 旧链路仍可用;
# 已移除的包装 Skill 需要回退版本)。
harness.a2a.tool-routing.enabled=true
harness.a2a.tool-routing.metadata-cache-ttl-ms=30000
harness.a2a.tool-routing.metric-catalog-max-chars=8000
harness.a2a.tool-routing.default-limit=10
harness.a2a.tool-routing.max-limit=20
harness.a2a.tool-routing.strict-startup=false

# 动态 system-prompt 片段。历史案例默认有意禁用。
harness.episodic.retrieval.enabled=false
harness.a2a.memory.max-system-prompt-chars=0
harness.a2a.dimension.max-chars=2000


