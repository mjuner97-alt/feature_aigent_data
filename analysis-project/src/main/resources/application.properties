spring.application.name = analysis_project
spring.profiles.active=dev,sandbox-windows


# ==== 多数据源:禁用 mybatis-spring-boot-starter 的自动配置 ===================
# 我们在 com.agentscopea2a.config.datasource 下手动声明 3 套
# SqlSessionFactory + MapperScan,自动配置会与之冲突,这里关闭。
# 注意: io.agentscope.spring.boot.a2a.AgentscopeA2aAutoConfiguration 在 2.0.0-RC5 JAR
# 中并未注册为自动配置类(无 AutoConfiguration.imports 条目), Spring Boot 3.x 会在
# 启动时校验 exclude 列表并抛 IllegalStateException, 故不能写入此处.
spring.autoconfigure.exclude=org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration



