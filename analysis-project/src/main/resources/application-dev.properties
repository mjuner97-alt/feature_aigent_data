# ---- 工作区同步轮询间隔 ---------------------------------------------------
harness.a2a.workspace.sync.intervalMs=20000


### sandbox 注入

# ---- Sandbox: 把 shell/filesystem 隔离到 Docker -----------------------------
harness.a2a.sandbox.enabled=true
harness.a2a.sandbox.image=deepanalyze-vllm:latest
harness.a2a.sandbox.workspace-root=/workspace
# SESSION = 每会话独立 sandbox 命名空间(共享容器内按 session ID 隔离)
# GLOBAL 会导致 JAR 用 __global__ 作 state key,MySQL state store 拒绝
harness.a2a.sandbox.isolation-scope=SESSION
harness.a2a.sandbox.subagent-isolation-scope=SESSION
harness.a2a.sandbox.mount-skills=true
harness.a2a.sandbox.mount-memory=true
harness.a2a.sandbox.mount-artifacts=true
harness.a2a.sandbox.remote-docker-enabled=true
harness.a2a.sandbox.remote-docker-ssh-target=docker-host
# ssh-options 继承自 application.properties (P2-4 共享段)
harness.a2a.sandbox.remote-docker-timeout-seconds=60
# 运维侧需先 docker run -d --name <此名> ...，本进程只 docker exec 进去
# 2026-08-06: 从 agentscope-shared-demo (deepanalyze-vllm 镜像, 无 jpype) 切到
# analysis-project-test (plan-b 镜像, 含 jpype1 + pandas + opengauss-jdbc).
# 原因: script_exec 调 openGauss 需 JPype+opengauss-jdbc (psycopg2 不支持 SHA256 SASL),
# deepanalyze-vllm 镜像没装 jpype1; plan-b 镜像 Dockerfile:49-55 已 pip install jpype1.
# analysis-project-test 容器 /workspace/harness-a2a 整体 bind mount 到宿主机
# /java/analysis-workspace, scripts/ 子目录自动可见 (无需额外 bind mount).
harness.a2a.sandbox.shared-container-name=analysis-project-test

# ---- 彻底关闭 workspace tar 同步 -------------------------------------------
# DockerSandbox.doHydrateWorkspace() 入口短路, 不管是 projection 还是 snapshot
# 恢复调它, 都不会跑 `docker exec -i tar -xf - -C /workspace`.
# 前提: 容器内 /workspace 必须已经有全部文件 (bind mount / scp / 镜像内置).
# 副作用: snapshot 跨会话恢复形同虚设 (每次 start 走 Branch A 不动 /workspace,
# 或 Branch D fresh init 只跑本地 applyWorkspaceSpec, 都不会推 tar 到容器).
harness.a2a.sandbox.hydrate-enabled=false


# ---- Artifact 走 SSH（远端 Docker daemon 场景）----------------------------
# CSV 必须落到远端机磁盘，否则容器 bind-mount 看到空目录
harness.a2a.artifacts.remote.enabled=true
harness.a2a.artifacts.remote.ssh-target=docker-host
harness.a2a.artifacts.remote.remote-root=/opt/agentscope-workspace/harness-a2a/artifacts
# ssh-options 继承自 application.properties (P2-4 共享段)
harness.a2a.artifacts.remote.timeout-seconds=30

# CSV 下载短链场景: cleanupTask 默认在每个 chat 请求结束 rm -rf 整个 taskBucket,
# 会导致用户点下载链接时 CSV 已被清理 -> 404. dev 环境关掉 cleanup 让短链长期有效.
# 生产环境应改用 "CSV 内容落 url_shortener 表" 方案, 不要直接关 GC.
harness.a2a.artifact.keep-artifacts=true

# CSV 下载链接的 base URL (协议+host+port). 空 -> 相对路径走 vite proxy (默认).
# 设了 -> LLM 返回完整 URL, 如 http://localhost:5175/redirect/download?shortCode=xxx
# dev 环境用 5175 (vite dev server), 生产用实际域名.
harness.a2a.csv-download.base-url=http://localhost:5175


# ---- Skills 双向同步（同样用于远端 Docker） -------------------------------
harness.a2a.skills.remote.enabled=true
harness.a2a.skills.remote.ssh-target=docker-host
harness.a2a.skills.remote.remote-root=/opt/agentscope-workspace/harness-a2a/skills
# ssh-options 继承自 application.properties (P2-4 共享段)
harness.a2a.skills.remote.timeout-seconds=30
# RemoteDirSyncer syncs skills-auto/ → <remote-root>-auto and
# skills-user/ → <remote-root>-user. Both dirs are bind-mounted into the
# sandbox container via FilesystemConfig.buildSandboxSpec().


# ---- Skill 自进化 PR2 — Windows 沙箱下强制关闭 ---------------------------
# 原因：Auto-synth (Path B) 的 distractWithContext 在 PreCall 触发 LLM 调用，
# Windows JVM + 远端 Docker 拓扑下，LLM 网络延迟 + 临时文件路径差异导致蒸馏出
# 泛化 skill(query_quality_data/python_exec)，而非真实工具链。
# 离线消化 (Path A / MemoryDigestionService) 已修复并验证正确，应走此路。
harness.skills.auto-synth.enabled=true
# 原因：MemoryFlushHook 把 base64 后的 MEMORY.md 内联到 docker exec sh -c '...'，
# Windows CreateProcess 命令行 8KB 上限会触发 error=206 文件名或扩展名太长。
# MySQL mirror 兜底，关掉只是少了容器内文件副本，数据不丢。
harness.a2a.memory.remote.enabled=false
harness.a2a.memory.remote.ssh-target=docker-host
harness.a2a.memory.remote.remote-root=/opt/agentscope-workspace/harness-a2a/memory
# ssh-options 继承自 application.properties (P2-4 共享段)
harness.a2a.memory.remote.timeout-seconds=30

# Memory MySQL 镜像：GLOBAL 共享容器下必须开（保住租户隔离的真相之源）
harness.a2a.memory.mysql-mirror.enabled=true
harness.a2a.memory.mysql-mirror.poll-seconds=5